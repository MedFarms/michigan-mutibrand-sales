# TEMPORARY — credit/balance audit. Manual-run only. Delete after use.
#
# What this does:
#   - Runs ONLY when you click "Run workflow" (no schedule, no push trigger).
#   - Reads the same LEAFLINK_API_KEY secret the real scraper uses.
#   - Runs leaflink_credit_audit.py and prints the report to the Actions log.
#   - Writes NOTHING, commits NOTHING, and does not touch scraper.py or any data.
#
# How to use:
#   1. Put leaflink_credit_audit.py in the repo root (same folder as scraper.py).
#   2. Put this file at .github/workflows/credit-audit.yml
#   3. GitHub -> Actions tab -> "Credit Audit (temporary)" -> "Run workflow".
#   4. Open the finished run -> the "Run audit" step -> copy the printed report.
#   5. Delete BOTH this file and leaflink_credit_audit.py when done.
#
# Note: no `permissions: contents: write` here on purpose — this job cannot
# commit anything back to the repo even if it wanted to.

name: Credit Audit (temporary)

on:
  workflow_dispatch:        # manual only — never runs on its own

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run audit
        env:
          LEAFLINK_API_KEY: ${{ secrets.LEAFLINK_API_KEY }}
          LEAFLINK_FROM_DATE: '2025-06-01'
          LEAFLINK_MAX_PAGES: '40'
        run: python leaflink_credit_audit.py
